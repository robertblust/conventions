# The guard compares the release this file declares with the pin, because the runner exposes nothing about
# the called workflow to its steps; it cannot see how the caller spelled the ref, so a member calls it at
# the tag conventions.json names, and a call at a branch gets whatever that branch declares.
name: conventions
on:
  workflow_call:
env:
  CONVENTIONS_RELEASE: v1.38.0
jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: the workflow's release is the member's pin
        run: |
          [ -f conventions.json ] || { echo "✗ conventions: no conventions.json here — a member names the release it follows" >&2; exit 1; }
          pin=$(sed -n 's/.*"tag" *: *"\([^"]*\)".*/\1/p' conventions.json | head -1)
          if [ "$CONVENTIONS_RELEASE" != "$pin" ]; then
            echo "✗ conventions: this workflow is release $CONVENTIONS_RELEASE, conventions.json names $pin — to take $CONVENTIONS_RELEASE, set the tag in conventions.json to it and run sh conventions/conventions-sync sync; to stay on $pin, call check.yml at $pin" >&2
            exit 1
          fi
          echo "✓ conventions: workflow and pin agree on $pin"
      - run: sh conventions/conventions-sync check
      - run: sh conventions/conventions-check
      # The Markdown form is markdownlint's, which needs Node 22 or later; the runner's default
      # Node is whatever the image ships, so the version is named here rather than assumed.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sh conventions/conventions-format
      # A member with no model of its own is governed by its organization's instance. A member
      # that is an instance runs the same check from the instance workflow, so it is skipped here.
      - name: the governing instance
        if: github.event_name == 'pull_request' && hashFiles('.companygraph/manifest.json') == ''
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/mental-model
          path: .governing-instance
      - name: every commit names a seat its phase lists
        if: github.event_name == 'pull_request' && hashFiles('.companygraph/manifest.json') == ''
        # This tag moves when a meta-model release changes what `commits` checks.
        env:
          COMPANYGRAPH_RELEASE: v0.60.0
        run: |
          npx --yes --package "github:companygraph/meta-model#${COMPANYGRAPH_RELEASE}" companygraph commits .governing-instance --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
