name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # The job id is what the branch ruleset requires. Rename it only together with the ruleset.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: shellcheck conventions/conventions-sync conventions/conventions-check conventions/conventions-format conventions/hooks/commit-msg test/run.sh
      - run: python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ('.github/workflows/check.yml', '.github/workflows/ci.yml', '.github/workflows/report.yml')]"
      - run: sh test/run.sh
      - run: sh conventions/conventions-check
      - run: sh conventions/conventions-format
      # This repository carries no model of its own, so its own pull requests are governed by
      # robertblust/mental-model, the same as every other model-less member of the organization.
      - name: the governing instance
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: robertblust/mental-model
          path: .governing-instance
      - name: every commit names a seat its phase lists
        if: github.event_name == 'pull_request'
        # The checker is the release the governing instance's manifest names as `tooling`, as the
        # commit-msg hook takes it, so the seat check runs at the release that instance's seats
        # were checked with and this family pins no meta-model release of its own.
        run: |
          tooling=$(node -p "require('./.governing-instance/.companygraph/manifest.json').tooling")
          npx --yes --package "github:companygraph/meta-model#v${tooling}" companygraph commits .governing-instance --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
